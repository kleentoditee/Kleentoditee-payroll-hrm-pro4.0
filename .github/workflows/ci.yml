name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  node:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://kleentoditee:kleentoditee@localhost:5432/kleentoditee?schema=public
      JWT_SECRET: ci-only-jwt-secret-change-before-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: API tests
        run: npm run test --workspace api

      - name: Build
        run: npm run build
